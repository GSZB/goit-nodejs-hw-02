services:
  db:
    image: postgres:17-alpine
    container_name: announcements-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: announcements
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - announcements-data:/var/lib/postgresql/data

volumes:
  announcements-data:
